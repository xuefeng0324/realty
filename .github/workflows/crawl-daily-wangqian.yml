name: crawl-daily-wangqian

on:
  # 工作日 09:30 北京时间 = 01:30 UTC（政府数据通常 T+1 更新）
  schedule:
    - cron: "30 1 * * 1-5"
  workflow_dispatch:

concurrency:
  group: crawl-daily-wangqian
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 设 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: realty_app/scripts/crawl_daily_wangqian.py

      - name: 装依赖
        run: pip install requests

      - name: 抓取深广网签（merge）+ 广州新房库存
        shell: bash
        run: |
          set -o pipefail   # 否则 python 失败会被 tee 吞掉导致假成功
          cd realty_app
          python scripts/crawl_daily_wangqian.py fetch --merge 2>&1 | tee wangqian.log
          python scripts/publish_wangqian_meta.py
          # 周聚合须随 daily 重建，否则仪表盘网签热度/周环比落后（见 HOUSING_PRICE_ACCEPTANCE Phase B）
          python scripts/build_wangqian_heatmap.py
          # 广州住建可售/未售/签约：按 date+district merge（HOUSING Phase E）
          python scripts/crawl_gz_new_house_inventory.py 2>&1 | tee gz_inventory.log

      - name: 看结果
        shell: bash
        run: |
          cd realty_app
          echo "===== daily_wangqian.csv 行数 ====="
          wc -l static/daily_wangqian.csv
          echo "===== wangqian_meta.json ====="
          cat static/wangqian_meta.json || true
          echo "===== wangqian_district_weekly 最近 week_end ====="
          cut -d, -f4 static/seed/wangqian_district_weekly.csv | sort -u | tail -5 || true
          echo "===== 最近全市汇总（date,city,category,scope,全市,...）====="
          grep ',全市,' static/daily_wangqian.csv | tail -8 || true
          echo "===== gz_new_house_inventory 日期 ====="
          cut -d, -f1 static/gz_new_house_inventory.csv | sort -u | tail -5 || true
          cat wangqian.log
          cat gz_inventory.log || true

      - name: 提交 CSV
        run: |
          cd realty_app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet HEAD -- static/daily_wangqian.csv static/wangqian_meta.json static/seed/wangqian_district_weekly.csv static/gz_new_house_inventory.csv; then
            git add static/daily_wangqian.csv static/wangqian_meta.json static/seed/wangqian_district_weekly.csv static/gz_new_house_inventory.csv
            git commit -m "data(wangqian+gz-inv): 日更网签/周聚合与广州库存 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "数据无变化（同日已抓过），跳过 commit"
          fi
