# check-csv-freshness.yml — 每天扫描 static/*.csv 数据陈旧度
#
# 背景：之前 wangqian 抓取连续 21 天陈旧没人发现，是因为只盯一个数据源。
# 仓库里 41 个 CSV 各自有爬取脚本，绝大部分陈旧是静默的。本 workflow 在
# realty-app-e2e 之后 30 分钟跑，给一份统一陈旧度仪表盘：
#   - OK   < warn-days（默认 30）
#   - WARN 30..stale-days（默认 60）
#   - STALE ≥ stale-days（默认 60）
#
# 触发：每天 02:30 UTC = 10:30 北京时间（避开 crawl-daily-wangqian 01:30 UTC
# 和 e2e 18:00 UTC，避免互相挤 cron runner）。
#
# 输出：
#   1. GITHUB_STEP_SUMMARY：markdown 表格，人眼扫
#   2. artifact：raw markdown + json，方便归档比对
#   3. 退出码 ≥1 → workflow 标红，邮件告警（与 e2e 一致）
#
# 不自动开 issue：避免半夜被批量 issue 轰炸；改成「人在 PR 里能一眼看到陈旧源」。

name: realty_app csv freshness

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realty_app-freshness
  cancel-in-progress: true

jobs:
  check:
    name: 扫描 static/*.csv
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: realty_app

    steps:
      - name: 拉代码
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 跑扫描（markdown 表格）
        id: md
        run: |
          # 豁免名单（年初/季度/月度一次性发布的源，freshness 默认阈值不适用）：
          #   provident_fund_rates.csv        — 公积金利率年度调整（5 月初一次发布）
          #   education_overview.csv           — 教育事业统计年报（6 月发 2025 年报）
          #   gz/sz_provident_annual.csv       — 公积金年度报告（3 月底一次）
          #   zh_provident_dynamics.csv        — 珠海公积金动态月报（源站偶发不发）
          #   zh_bdc_registration.csv          — 珠海不动产登记季报（9 月才出 Q3）
          #   zh_price_filing.csv               — 珠海源站 404（等源恢复后从白名单移除）
          #   nbs_avg_wage.csv                  — 国家统计局城镇平均工资年报（5 月发）
          #   stats_70.csv                      — 70 城指数月度（每月 18 日发布下月）
          #   gd_construction.csv               — 广东省建筑业生产运行简况（半年/季度发）
          #   gz_housing_plan.csv               — 广州住房发展年度计划（年初发）
          python scripts/check_csv_freshness.py \
            --exempt-from-stale \
              gz_provident_annual.csv,sz_provident_annual.csv,gd_provident_annual.csv,provident_fund_rates.csv,zh_provident_dynamics.csv,education_overview.csv,zh_bdc_registration.csv,zh_price_filing.csv,nbs_avg_wage.csv,stats_70.csv,gd_construction.csv,gz_housing_plan.csv \
            > freshness.md
          echo "exit=$?" >> $GITHUB_OUTPUT

      - name: 跑扫描（JSON 给归档）
        if: always()
        run: |
          python scripts/check_csv_freshness.py \
            --exempt-from-stale \
              gz_provident_annual.csv,sz_provident_annual.csv,gd_provident_annual.csv,provident_fund_rates.csv,zh_provident_dynamics.csv,education_overview.csv,zh_bdc_registration.csv,zh_price_filing.csv,nbs_avg_wage.csv,stats_70.csv,gd_construction.csv,gz_housing_plan.csv \
            --json > freshness.json || true

      - name: 输出 markdown 到 job summary
        if: always()
        run: |
          cat freshness.md >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact（30 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realty_app-freshness
          path: |
            realty_app/freshness.md
            realty_app/freshness.json
          retention-days: 30