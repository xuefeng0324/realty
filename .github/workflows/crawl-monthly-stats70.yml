name: crawl-monthly-stats70

# 房价 Phase D/E：每月中旬
# - hugohe3/70cityprice → stats_70.csv
# - 国家统计局全国房地产 → nbs_real_estate.csv（period merge）
# - 国家统计局全国固投 → nbs_fa_investment.csv（period merge）
# - 国家统计局居民收入消费 → nbs_income.csv（季/半年 merge）
# - 国家统计局城镇单位年平均工资 → nbs_avg_wage.csv（年更）
# - 国家统计局国内生产总值初步核算 → nbs_gdp.csv（季更）
# - 国家统计局城镇调查失业率（国民经济运行通稿）→ nbs_unemployment.csv
# - 国家统计局服务业生产指数（国民经济运行通稿）→ nbs_service_index.csv
# - 交通运输部交通运输经济运行 → mot_transport.csv
# - 国家统计局月度 CPI（含居住/房租）→ nbs_cpi.csv
# - 国家统计局月度 PPI（含建材分项）→ nbs_ppi.csv
# - 国家统计局社消装潢/家具 → nbs_retail.csv
# - 国家统计局国民经济通稿·货物进出口（海关口径）→ nbs_trade.csv
# - 国家统计局采购经理指数 → nbs_pmi.csv
# - 国家统计局规模以上工业增加值 → nbs_industrial.csv
# - 国家统计局能源生产情况 → nbs_energy.csv
# - 国家统计局规上工业企业利润 → nbs_industrial_profit.csv
# - 中债国债收益率 → chinabond_yield.csv
# - Shibor → shibor.csv
# - 回购定盘 FR/FDR → repo_fixing.csv
# 对照：realty_app/docs/HOUSING_PRICE_ACCEPTANCE.md
# 统计局通常 15–17 日发布上月指数 / 房地产月报；16–20 日 UTC 02:00 ≈ 北京 10:00

on:
  schedule:
    - cron: "0 2 16-20 * *"
  workflow_dispatch:

concurrency:
  group: crawl-monthly-stats70
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 设 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 下载并校验 70 城指数
        id: stats70
        continue-on-error: true
        working-directory: realty_app
        run: |
          set -o pipefail
          python scripts/crawl_stats_70.py download --out static/stats_70.csv 2>&1 | tee stats70.log
          # 16–19 日上月数据尚未发布只发 warning；20 日仍落后才失败。
          # 文件缺失、结构损坏或落后两个月以上在任何日期都会失败。
          python scripts/check_stats70_freshness.py \
            --csv static/stats_70.csv \
            --deadline-day 20 2>&1 | tee -a stats70.log

      - name: merge NBS 全国房地产/固投/居民收入/CPI/PPI/社消
        id: monthly_sources
        working-directory: realty_app
        run: |
          set -o pipefail
          # Phase E：首页最新一期 merge，不抹掉已回填历史
          python scripts/crawl_nbs_real_estate.py 2>&1 | tee nbs.log
          python scripts/crawl_nbs_fa_investment.py 2>&1 | tee nbs_fa.log
          python scripts/crawl_nbs_income.py 2>&1 | tee nbs_income.log || true
          python scripts/crawl_nbs_avg_wage.py 2>&1 | tee nbs_avg_wage.log || true
          python scripts/crawl_nbs_gdp.py 2>&1 | tee nbs_gdp.log || true
          python scripts/crawl_nbs_unemployment.py 2>&1 | tee nbs_unemployment.log || true
          python scripts/crawl_nbs_service_index.py 2>&1 | tee nbs_service_index.log || true
          python scripts/crawl_mot_transport.py --backfill 2>&1 | tee mot_transport.log || true
          python scripts/crawl_nbs_cpi.py 2>&1 | tee nbs_cpi.log || true
          python scripts/crawl_nbs_ppi.py 2>&1 | tee nbs_ppi.log || true
          python scripts/crawl_nbs_retail.py 2>&1 | tee nbs_retail.log || true
          python scripts/crawl_nbs_trade.py 2>&1 | tee nbs_trade.log || true
          python scripts/crawl_nbs_pmi.py 2>&1 | tee nbs_pmi.log || true
          python scripts/crawl_nbs_industrial.py 2>&1 | tee nbs_industrial.log || true
          python scripts/crawl_nbs_energy.py 2>&1 | tee nbs_energy.log || true
          python scripts/crawl_nbs_industrial_profit.py 2>&1 | tee nbs_industrial_profit.log || true
          python scripts/crawl_lpr_history.py --max 24 2>&1 | tee lpr.log
          python scripts/crawl_mlf_history.py --max 24 2>&1 | tee mlf.log || true
          python scripts/crawl_omo_rr.py --max 40 2>&1 | tee omo_rr.log || true
          python scripts/crawl_chinabond_yield.py --backfill-days 45 2>&1 | tee chinabond_yield.log || true
          python scripts/crawl_shibor.py --backfill-days 45 2>&1 | tee shibor.log || true
          python scripts/crawl_repo_fixing.py --backfill-days 45 2>&1 | tee repo_fixing.log || true
          python scripts/crawl_pbc_fin_stats.py --max 18 2>&1 | tee pbc_fin.log || true
          python scripts/crawl_pbc_region_sf.py --max 8 2>&1 | tee pbc_region_sf.log || true
          python scripts/crawl_safe_forex.py --max 50 --news-pages 30 2>&1 | tee safe_forex.log || true
          python scripts/crawl_safe_settle.py --max 30 --news-pages 16 2>&1 | tee safe_settle.log || true
          python scripts/crawl_safe_fx_market.py --max 30 --news-pages 20 2>&1 | tee safe_fx_market.log || true
          python scripts/crawl_safe_usd_mid.py --months 18 2>&1 | tee safe_usd_mid.log || true
          python scripts/crawl_safe_ora.py 2>&1 | tee safe_ora.log || true
          python scripts/crawl_safe_bop_trade.py --max 36 --news-pages 24 2>&1 | tee safe_bop_trade.log || true
          python scripts/crawl_safe_iip.py --max 24 --news-pages 30 2>&1 | tee safe_iip.log || true
          python scripts/crawl_safe_bop.py --max 20 --news-pages 36 2>&1 | tee safe_bop.log || true

      - name: 看结果
        working-directory: realty_app
        run: |
          echo "===== 最新 stats70 date ====="
          cut -d, -f1 static/stats_70.csv | sort -u | tail -5
          wc -l static/stats_70.csv
          echo "===== nbs periods ====="
          cut -d, -f1,2 static/nbs_real_estate.csv | tail -8
          echo "===== nbs fa periods ====="
          cut -d, -f1,2 static/nbs_fa_investment.csv | tail -8
          echo "===== nbs income periods ====="
          cut -d, -f1,2 static/nbs_income.csv | tail -8
          echo "===== nbs cpi months ====="
          cut -d, -f1,2 static/nbs_cpi.csv | tail -8
          echo "===== nbs ppi months ====="
          cut -d, -f1,2 static/nbs_ppi.csv | tail -8
          echo "===== nbs retail months ====="
          cut -d, -f1,2 static/nbs_retail.csv | tail -8
          echo "===== nbs trade months ====="
          cut -d, -f1,2 static/nbs_trade.csv | tail -8
          echo "===== nbs pmi months ====="
          cut -d, -f1,2 static/nbs_pmi.csv | tail -8
          echo "===== nbs industrial months ====="
          cut -d, -f1,3 static/nbs_industrial.csv | tail -8
          echo "===== nbs industrial profit months ====="
          cut -d, -f1,3,4 static/nbs_industrial_profit.csv | tail -8
          echo "===== chinabond yield dates ====="
          cut -d, -f1,8 static/seed/chinabond_yield.csv | head -6
          echo "===== shibor dates ====="
          cut -d, -f1,2 static/seed/shibor.csv | head -6
          echo "===== repo fixing dates ====="
          cut -d, -f1,3,6 static/seed/repo_fixing.csv | head -6
          cat stats70.log
          cat nbs.log || true
          cat nbs_fa.log || true
          cat nbs_income.log || true
          cat nbs_cpi.log || true
          cat nbs_ppi.log || true
          cat nbs_retail.log || true
          cat nbs_trade.log || true
          cat nbs_pmi.log || true
          cat nbs_industrial.log || true
          cat nbs_industrial_profit.log || true
          cat chinabond_yield.log || true
          cat shibor.log || true
          cat repo_fixing.log || true

      - name: 有变更则提交
        run: |
          cd realty_app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet HEAD -- static/stats_70.csv static/nbs_real_estate.csv static/nbs_fa_investment.csv static/nbs_income.csv static/nbs_avg_wage.csv static/nbs_gdp.csv static/nbs_unemployment.csv static/nbs_service_index.csv static/mot_transport.csv static/nbs_cpi.csv static/nbs_ppi.csv static/nbs_retail.csv static/nbs_trade.csv static/nbs_pmi.csv static/nbs_industrial.csv static/nbs_energy.csv static/nbs_industrial_profit.csv static/seed/lpr_history.csv static/seed/mlf_history.csv static/seed/omo_rr_history.csv static/seed/chinabond_yield.csv static/seed/shibor.csv static/seed/repo_fixing.csv static/seed/pbc_fin_stats.csv static/seed/pbc_region_sf.csv static/seed/safe_forex.csv static/seed/safe_settle.csv static/seed/safe_fx_market.csv static/seed/safe_usd_mid.csv static/seed/safe_ora.csv static/seed/safe_bop_trade.csv static/seed/safe_iip.csv static/seed/safe_bop.csv; then
            git add static/stats_70.csv static/nbs_real_estate.csv static/nbs_fa_investment.csv static/nbs_income.csv static/nbs_avg_wage.csv static/nbs_gdp.csv static/nbs_unemployment.csv static/nbs_service_index.csv static/mot_transport.csv static/nbs_cpi.csv static/nbs_ppi.csv static/nbs_retail.csv static/nbs_trade.csv static/nbs_pmi.csv static/nbs_industrial.csv static/nbs_energy.csv static/nbs_industrial_profit.csv static/seed/lpr_history.csv static/seed/mlf_history.csv static/seed/omo_rr_history.csv static/seed/chinabond_yield.csv static/seed/shibor.csv static/seed/repo_fixing.csv static/seed/pbc_fin_stats.csv static/seed/pbc_region_sf.csv static/seed/safe_forex.csv static/seed/safe_settle.csv static/seed/safe_fx_market.csv static/seed/safe_usd_mid.csv static/seed/safe_ora.csv static/seed/safe_bop_trade.csv static/seed/safe_iip.csv static/seed/safe_bop.csv
            git commit -m "data(stats70+nbs+rates+fin+safe): 月更 70城/全国房地产/固投/居民收入/CPI/PPI/社消/贸易/PMI/工业增加值/工业企业利润/LPR/利率/金融统计/外储等 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "stats_70 / nbs / rates / fin / safe 无变化，跳过 commit"
          fi

      - name: 上传月更日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-monthly-logs
          path: realty_app/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: 70 城最终质量门禁
        if: always()
        env:
          STATS70_OUTCOME: ${{ steps.stats70.outcome }}
        run: |
          if [ "$STATS70_OUTCOME" != "success" ]; then
            echo "::error title=70 城月更失败::下载、结构校验或截止日新鲜度未通过；其它月更来源已继续执行"
            exit 1
          fi
          echo "70 城月更通过（含截止日前 warning 状态）"
