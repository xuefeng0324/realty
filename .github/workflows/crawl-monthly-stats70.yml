name: crawl-monthly-stats70

# 房价 Phase D/E：每月中旬
# - hugohe3/70cityprice → stats_70.csv
# - 国家统计局全国房地产 → nbs_real_estate.csv（period merge）
# - 国家统计局全国固投 → nbs_fa_investment.csv（period merge）
# - 国家统计局居民收入消费 → nbs_income.csv（季/半年 merge）
# 对照：realty_app/docs/HOUSING_PRICE_ACCEPTANCE.md
# 统计局通常 15–17 日发布上月指数 / 房地产月报；16–20 日 UTC 02:00 ≈ 北京 10:00

on:
  schedule:
    - cron: "0 2 16-20 * *"
  workflow_dispatch:

concurrency:
  group: crawl-monthly-stats70
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 设 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 下载 70 城指数 + merge NBS 全国房地产/固投/居民收入
        working-directory: realty_app
        run: |
          set -o pipefail
          python scripts/crawl_stats_70.py download --out static/stats_70.csv 2>&1 | tee stats70.log
          python scripts/check_stats70_freshness.py --csv static/stats_70.csv
          # Phase E：首页最新一期 merge，不抹掉已回填历史
          python scripts/crawl_nbs_real_estate.py 2>&1 | tee nbs.log
          python scripts/crawl_nbs_fa_investment.py 2>&1 | tee nbs_fa.log
          python scripts/crawl_nbs_income.py 2>&1 | tee nbs_income.log || true
          python scripts/crawl_lpr_history.py --max 24 2>&1 | tee lpr.log

      - name: 看结果
        working-directory: realty_app
        run: |
          echo "===== 最新 stats70 date ====="
          cut -d, -f1 static/stats_70.csv | sort -u | tail -5
          wc -l static/stats_70.csv
          echo "===== nbs periods ====="
          cut -d, -f1,2 static/nbs_real_estate.csv | tail -8
          echo "===== nbs fa periods ====="
          cut -d, -f1,2 static/nbs_fa_investment.csv | tail -8
          echo "===== nbs income periods ====="
          cut -d, -f1,2 static/nbs_income.csv | tail -8
          cat stats70.log
          cat nbs.log || true
          cat nbs_fa.log || true
          cat nbs_income.log || true

      - name: 有变更则提交
        run: |
          cd realty_app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet HEAD -- static/stats_70.csv static/nbs_real_estate.csv static/nbs_fa_investment.csv static/nbs_income.csv static/seed/lpr_history.csv; then
            git add static/stats_70.csv static/nbs_real_estate.csv static/nbs_fa_investment.csv static/nbs_income.csv static/seed/lpr_history.csv
            git commit -m "data(stats70+nbs+lpr): 月更 70城/全国房地产/固投/居民收入/LPR $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "stats_70 / nbs / nbs_fa / nbs_income / lpr 无变化，跳过 commit"
          fi
