name: crawl-weekly

on:
  # 每周一 05:00 (UTC+8) = 21:00 UTC (周日)
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:        # 允许在 Actions 页面手动触发

concurrency:
  group: crawl-weekly
  cancel-in-progress: false  # 不取消正在跑的 cron（避免一周跑 2 次）

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 自动 commit 需要 write 权限

    steps:
      - name: 拉代码
        uses: actions/checkout@v4

      - name: 设 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # 没 requirements.txt 时 setup-python 默认扫所有 .py 也能命中
          cache-dependency-path: realty_app/scripts/crawl_anjuke.py

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml xlrd==2.0.1 pypdf

      - name: 跑爬虫（m.anjuke.com）
        id: crawl
        run: |
          cd realty_app
          # Phase C：少于 --min-rows（默认 50）会 exit 2，不覆盖已有 listings（告警=红）
          python scripts/crawl_anjuke.py --min-rows 50 2>&1 | tee crawl.log
        continue-on-error: false

      - name: 校验 REAL 挂牌写入（成功爬取后）
        if: success()
        run: |
          cd realty_app
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("static/seed/listings.csv")
          rows = list(csv.DictReader(p.open(encoding="utf-8-sig")))
          real = [r for r in rows if (r.get("source_kind") or "").upper() == "REAL"]
          print(f"listings={len(rows)} REAL={len(real)}")
          if len(real) < 1:
              raise SystemExit("Phase C: 成功写入后应至少 1 条 REAL")
          dates = [r.get("crawl_date") or "" for r in real if r.get("crawl_date")]
          print("latest REAL crawl_date=", max(dates) if dates else None)
          PY

      - name: 看结果
        run: |
          cd realty_app
          echo "===== listings.csv 前 3 行 ====="
          head -3 static/seed/listings.csv
          echo "===== 行数 ====="
          wc -l static/seed/listings.csv
          echo "===== crawl.log ====="
          cat crawl.log

      - name: 重建房源派生数据并发布完整快照指纹
        run: |
          cd realty_app
          python scripts/rebuild_listing_derivatives.py
          python scripts/publish_csv.py

      - name: 刷新广深珠教育 + 深圳计划入市 + 广州住房计划/居住用地/保障房 + 深圳居住用地 + 珠海安居进展
        run: |
          cd realty_app
          python scripts/crawl_gz_education_overview.py
          python scripts/crawl_sz_education_overview.py
          python scripts/crawl_zh_education_overview.py
          python scripts/crawl_sz_planned_supply.py --max 12
          python scripts/crawl_gz_housing_plan.py
          python scripts/crawl_gz_affordable_projects.py --max 12
          python scripts/crawl_gz_affordable_targets.py --max 12
          python scripts/crawl_gz_land_deals.py --pages 12 --max-detail 120
          python scripts/crawl_sz_land_deals.py --pages 4 --page-size 50
          python scripts/crawl_sz_affordable_projects.py --max 8
          python scripts/crawl_zh_affordable_progress.py --max 8
          python scripts/crawl_sz_provident_annual.py --max 6
          python scripts/crawl_gz_provident_annual.py
          python scripts/crawl_zh_provident_dynamics.py
          python scripts/crawl_gd_provident_annual.py
          python scripts/crawl_gd_real_estate_brief.py --max 12
          python scripts/crawl_gd_fa_investment.py --max 8
          python scripts/crawl_gd_construction.py --max 8
          python scripts/crawl_gd_economy.py --max 8

      - name: 提交 CSV
        run: |
          cd realty_app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet HEAD -- static/seed/listings.csv static/education_overview.csv static/sz_planned_supply.csv static/gz_housing_plan.csv static/gz_affordable_projects.csv static/gz_affordable_targets.csv static/gz_land_deals.csv static/sz_land_deals.csv static/sz_affordable_projects.csv static/zh_affordable_progress.csv static/sz_provident_annual.csv static/gz_provident_annual.csv static/zh_provident_dynamics.csv static/gd_provident_annual.csv static/gd_real_estate_brief.csv static/gd_fa_investment.csv static/gd_construction.csv; then
            git add static/seed/*.csv static/seed/crawl_meta.json static/education_overview.csv static/sz_planned_supply.csv static/gz_housing_plan.csv static/gz_affordable_projects.csv static/gz_affordable_targets.csv static/gz_land_deals.csv static/sz_land_deals.csv static/sz_affordable_projects.csv static/zh_affordable_progress.csv static/sz_provident_annual.csv static/gz_provident_annual.csv static/zh_provident_dynamics.csv static/gd_provident_annual.csv static/gd_real_estate_brief.csv static/gd_fa_investment.csv static/gd_construction.csv
            git commit -m "data(anjuke): 刷新二手房挂牌 $(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              || echo "no commit needed"
            git push
          else
            echo "数据无变化，跳过 commit"
          fi
