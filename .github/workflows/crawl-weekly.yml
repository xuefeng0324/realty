name: crawl-weekly

on:
  # 每周一 05:00 (UTC+8) = 21:00 UTC (周日)
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:        # 允许在 Actions 页面手动触发

concurrency:
  group: crawl-weekly
  cancel-in-progress: false  # 不取消正在跑的 cron（避免一周跑 2 次）

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 自动 commit 需要 write 权限

    steps:
      - name: 拉代码
        uses: actions/checkout@v6

      - name: 设 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          # 没 requirements.txt 时 setup-python 默认扫所有 .py 也能命中
          cache-dependency-path: realty_app/scripts/crawl_anjuke.py

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml xlrd==2.0.1 pypdf

      - name: P0 · 刷新挂牌快照（链家为主源）
        id: p0_crawl
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          mkdir -p weekly-logs
          # 链家：目前唯一稳定可达的挂牌源（纯 stdlib，无三方依赖）。
          # --append 按 source_listing_id 去重保留旧行；抓完后统一 enrich 到真实小区。
          for city in 深圳 广州 珠海; do
            echo "===== ${city} ====="
            python scripts/crawl_lianjia_listings.py fetch --city "${city}" --pages 10 --delay 3 --append \
              2>&1 | tee "weekly-logs/p0-lianjia-${city}.log" || echo "[WARN] ${city} 链家抓取失败，继续其他城市"
          done

      - name: P0 · 关联链家房源到真实小区
        id: p0_enrich
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          # 新抓到的链家房源 community_id 初始为 0（链家列表页不落盘新小区），
          # 必须 enrich 到真实小区，否则小区排行 / 区对比会因为挂不上小区而查不到数据。
          python scripts/enrich_lianjia_listings.py assign --no-backup 2>&1 \
            | tee weekly-logs/p0-enrich.log

      - name: P0 · 安居客挂牌（尽力而为，源站已上 JS 风控）
        id: p0_anjuke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          # v1.122.54: m.anjuke.com 现在对所有请求返回 JS 网关反爬页
          # （esfcommon-captcha-geetest → callback.58.com/antibot/verifycode），
          # 纯 HTTP 爬虫拿不到列表，2026-07-26 起该步骤一直 exit 2，
          # 导致整条周更流水线（P1/P2 官方+宏观源）全部被跳过、数据停更。
          # 降级为尽力而为：源站恢复后这条数据会自动回来。
          python scripts/crawl_anjuke.py --min-rows 50 2>&1 \
            | tee weekly-logs/p0-anjuke.log

      - name: P0 · 校验 REAL 挂牌
        id: p0_validate
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          python - 2>&1 <<'PY' | tee weekly-logs/p0-validate.log
          import csv
          from pathlib import Path
          p = Path("static/seed/listings.csv")
          rows = list(csv.DictReader(p.open(encoding="utf-8-sig")))
          real = [r for r in rows if (r.get("source_kind") or "").upper() == "REAL"]
          print(f"listings={len(rows)} REAL={len(real)}")
          if len(real) < 1:
              raise SystemExit("Phase C: 成功写入后应至少 1 条 REAL")
          dates = [r.get("crawl_date") or "" for r in real if r.get("crawl_date")]
          print("latest REAL crawl_date=", max(dates) if dates else None)
          PY

      - name: P0 · 重建挂牌派生与快照指纹
        id: p0_rebuild
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          python scripts/rebuild_listing_derivatives.py 2>&1 \
            | tee weekly-logs/p0-rebuild.log
          python scripts/publish_csv.py 2>&1 \
            | tee -a weekly-logs/p0-rebuild.log

      - name: P0 · 提交挂牌核心快照
        id: p0_commit
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet HEAD -- static/seed; then
            git add -- static/seed/*.csv static/seed/crawl_meta.json
            git commit -m "data(anjuke): 刷新二手房挂牌 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "挂牌与派生数据无变化，跳过核心 commit"
          fi

      - name: P1 · 必需官方周更来源（全量执行，末尾统一判失败）
        id: p1_required
        continue-on-error: true
        # v1.122.54: 之前没有 if: always()，P0 一失败整条流水线就停在这里，
        # 官方周更源（土地成交 / 供应计划 / 保障房 / 学区…）全部停更。
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          python scripts/run_weekly_source_group.py \
            --group p1 \
            --log-dir weekly-logs \
            --status-file weekly-logs/p1-status.tsv \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: P2 · 尽力刷新宏观来源（失败告警但不阻塞）
        id: p2_optional
        continue-on-error: true
        if: always()
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          python scripts/run_weekly_source_group.py \
            --group p2 \
            --log-dir weekly-logs \
            --status-file weekly-logs/p2-status.tsv \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: 提交 P1/P2 成功结果并刷新完整快照指纹
        id: supplementary_commit
        if: always() && steps.p0_commit.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          cd realty_app
          supplement_paths=(
            static/education_overview.csv
            static/sz_planned_supply.csv
            static/gz_housing_plan.csv
            static/gz_affordable_projects.csv
            static/gz_affordable_targets.csv
            static/gz_land_deals.csv
            static/sz_land_deals.csv
            static/sz_affordable_projects.csv
            static/zh_affordable_progress.csv
            static/zh_price_filing.csv
            static/sz_provident_annual.csv
            static/gz_provident_annual.csv
            static/zh_provident_dynamics.csv
            static/gd_provident_annual.csv
            static/gd_real_estate_brief.csv
            static/gd_fa_investment.csv
            static/gd_construction.csv
            static/gd_economy.csv
            static/gd_industrial.csv
            static/gd_retail.csv
            static/gd_services.csv
            static/seed/mlf_history.csv
            static/seed/omo_rr_history.csv
            static/seed/chinabond_yield.csv
            static/seed/shibor.csv
            static/seed/repo_fixing.csv
            static/seed/pbc_fin_stats.csv
            static/seed/pbc_region_sf.csv
            static/seed/safe_forex.csv
            static/seed/safe_settle.csv
            static/seed/safe_fx_market.csv
            static/seed/safe_usd_mid.csv
            static/seed/safe_ora.csv
            static/seed/safe_bop_trade.csv
            static/seed/safe_iip.csv
            static/seed/safe_bop.csv
          )

          if ! git diff --quiet HEAD -- "${supplement_paths[@]}"; then
            if ! git diff --quiet HEAD -- static/seed; then
              python scripts/publish_csv.py 2>&1 \
                | tee weekly-logs/supplementary-snapshot.log
            fi
            git add -- "${supplement_paths[@]}" static/seed/crawl_meta.json
            git commit -m "data(weekly): 刷新官方与宏观来源 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "P1/P2 数据无变化，跳过补充 commit"
          fi

      - name: 上传 weekly 分源日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-weekly-logs
          path: realty_app/weekly-logs
          if-no-files-found: warn
          retention-days: 14

      - name: P0/P1 最终质量门禁
        if: always()
        env:
          P0_CRAWL: ${{ steps.p0_crawl.outcome }}
          P0_ENRICH: ${{ steps.p0_enrich.outcome }}
          P0_ANJUKE: ${{ steps.p0_anjuke.outcome }}
          P0_VALIDATE: ${{ steps.p0_validate.outcome }}
          P0_REBUILD: ${{ steps.p0_rebuild.outcome }}
          P0_COMMIT: ${{ steps.p0_commit.outcome }}
          P1_REQUIRED: ${{ steps.p1_required.outcome }}
          P2_OPTIONAL: ${{ steps.p2_optional.outcome }}
          SUPPLEMENTARY_COMMIT: ${{ steps.supplementary_commit.outcome }}
        shell: bash
        run: |
          failed=0
          for pair in \
            "P0 crawl:$P0_CRAWL" \
            "P0 enrich:$P0_ENRICH" \
            "P0 validate:$P0_VALIDATE" \
            "P0 rebuild:$P0_REBUILD" \
            "P0 commit:$P0_COMMIT" \
            "P1 required:$P1_REQUIRED"; do
            name=${pair%%:*}
            outcome=${pair#*:}
            if [ "$outcome" != "success" ]; then
              echo "::error title=weekly 质量门禁::${name} outcome=${outcome}"
              failed=1
            fi
          done
          # 安居客源站已上 JS 风控（2026-07-26 起），失败只告警不阻塞周更。
          if [ "$P0_ANJUKE" != "success" ]; then
            echo "::warning title=weekly 安居客不可达::outcome=${P0_ANJUKE}（源站 JS 风控，链家主源不受影响）"
          fi
          # P2 单源失败由组内 warning 表达；只有组装脚本自身异常才会 outcome=failure。
          if [ "$P2_OPTIONAL" = "failure" ]; then
            echo "::error title=weekly P2 编排失败::请查看分源日志"
            failed=1
          fi
          if [ "$P0_COMMIT" = "success" ] && [ "$SUPPLEMENTARY_COMMIT" != "success" ]; then
            echo "::error title=weekly 补充数据提交失败::outcome=${SUPPLEMENTARY_COMMIT}"
            failed=1
          fi
          exit "$failed"
