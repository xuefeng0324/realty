<?xml version="1.0" encoding="UTF-8"?>
<!--
  Realty App icon  simple, on theme
  Color: deep navy gradient + amber accent + minimalist bar chart
  Used as master. PNGs are generated by scripts/build_app_icons.py.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F2A47"/>
      <stop offset="100%" stop-color="#0A1C30"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7C56C"/>
      <stop offset="100%" stop-color="#E89A2E"/>
    </linearGradient>
  </defs>

  <!-- rounded square mask -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- abstract skyline: 4 vertical bars, increasing heights, amber -->
  <g transform="translate(232,300)">
    <rect x="0"   y="280" width="100" height="200" rx="16" fill="url(#amber)" opacity="0.55"/>
    <rect x="140" y="180" width="100" height="300" rx="16" fill="url(#amber)" opacity="0.75"/>
    <rect x="280" y="80"  width="100" height="400" rx="16" fill="url(#amber)"/>
    <rect x="420" y="200" width="100" height="280" rx="16" fill="url(#amber)" opacity="0.75"/>
    <!-- pin marker on top of the tallest bar -->
    <g transform="translate(330,40)">
      <path d="M0,0 C-50,0 -90,40 -90,90 C-90,140 0,200 0,200 C0,200 90,140 90,90 C90,40 50,0 0,0 Z"
            fill="#F7C56C"/>
      <circle cx="0" cy="86" r="32" fill="#0A1C30"/>
    </g>
  </g>

  <!-- subtitle -->
  <g transform="translate(0,860)" font-family="-apple-system, Segoe UI, Roboto, sans-serif"
     text-anchor="middle" fill="#E2E8F0">
    <text x="512" y="0" font-size="92" font-weight="700" letter-spacing="4">REALTY</text>
    <text x="512" y="84" font-size="34" font-weight="400" fill="#94A3B8" letter-spacing="6">ANALYTICS · '~:</text>
  </g>
</svg>